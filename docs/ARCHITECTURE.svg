<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title description">
  <title id="title">목 자세 코치 Android 앱 아키텍처</title>
  <desc id="description">사용자가 목 자세 코치 화면에서 사진 점검 또는 운동 루틴을 선택한다. 사진 점검은 CameraX 촬영, ML Kit 얼굴 검출, 귀와 C7 수동 확인, CVA 계산을 거친다. 운동 루틴은 타이머와 수행 확인을 거친다. 사진은 PostureSession 메모리에 두며 목표, 측정값, 실천 기록은 기기 안의 PostureStore에 저장한다. 기존 실시간 귀-어깨각 실험은 아래에 별도로 표시한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#52636b"/>
    </marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#138779"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#b97920"/>
    </marker>
    <style>
      text { font-family: 'Malgun Gothic', 'Noto Sans CJK KR', sans-serif; fill: #203038; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #596b72; }
      .zone { font-size: 19px; font-weight: 700; }
      .name { font-size: 19px; font-weight: 700; text-anchor: middle; }
      .label { font-size: 16px; text-anchor: middle; }
      .small { font-size: 14px; fill: #5c6c72; text-anchor: middle; }
      .note { font-size: 14px; fill: #5c6c72; }
      .card { fill: #fff; stroke: #b9c7ca; stroke-width: 1.5; rx: 8; }
      .wire { fill: none; stroke: #52636b; stroke-width: 2.2; marker-end: url(#arrow); stroke-linejoin: round; }
      .teal-wire { fill: none; stroke: #138779; stroke-width: 2.6; marker-end: url(#teal-arrow); stroke-linejoin: round; }
      .amber-wire { fill: none; stroke: #b97920; stroke-width: 2.6; marker-end: url(#amber-arrow); stroke-linejoin: round; }
    </style>
  </defs>
